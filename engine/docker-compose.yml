# Clip Radar engine stack: the unmodified OpenShorts core plus our gateway.
# Both listen on the host's 127.0.0.1 only. Never publish these ports.
# Layout on the server: this folder at ~/projects/clipradar-engine, the
# OpenShorts clone at ~/projects/openshorts, secrets in ./.env (mode 600).
name: clipradar-engine
services:
  backend:
    build: ../openshorts
    image: clipradar-openshorts-core:local
    container_name: clipradar-openshorts-core
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      # Stream VODs: the webcam in a corner gets its own band (camera_inset.py, local
      # person detector). Without a Gemini key the shot check is skipped and face-less
      # scenes count as the screen, so this works with OpenRouter only.
      SCREENCAST_LAYOUT: "1"
    volumes:
      - os_output:/app/output
      - os_uploads:/app/uploads
      - os_hf:/app/.cache/huggingface
      # Our moment-selection prompts (generated by apply_prompts.py).
      - ./overrides/gemini_worker.py:/app/gemini_worker.py:ro
      # Shot check through OpenRouter instead of a Gemini key (see overrides/sitecustomize.py).
      - ./overrides/openrouter_vision.py:/app/openrouter_vision.py:ro
      - ./overrides/sitecustomize.py:/opt/venv/lib/python3.11/site-packages/sitecustomize.py:ro
    mem_limit: 2800m
    memswap_limit: 6500m
    cpus: 1.8
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: clipradar-gateway:local
    container_name: clipradar-gateway
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      ENGINE_URL: http://backend:8000
      # Brief reader (campaign import) uses the same OpenRouter key as the core, from .env.
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
    # TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, UPLOAD_POST_API_KEY (mode 600, never committed).
    env_file: gateway.env
    volumes:
      - gw_data:/data
      # The core's stream stretches and clip metadata: the stacked layout (webcam on
      # top, game below) re-cuts clips from them (stacked.py), and files of posted or
      # rejected clips are deleted from them (retention.py).
      - os_output:/engine/output
      - os_uploads:/engine/uploads
    mem_limit: 700m
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  os_output: {}
  os_uploads: {}
  os_hf: {}
  gw_data: {}
